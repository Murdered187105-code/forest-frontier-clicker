<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сияющий страж — сборка и анимация</title>
<style>
:root{color-scheme:dark}
body{margin:0;padding:24px;background:radial-gradient(ellipse at 50% 0,#3a2c12,#100c04 70%);color:#fff4dc;font-family:Manrope,'Segoe UI',sans-serif}
h1{margin:0 0 6px;font-size:20px}.lead{margin:0 0 18px;color:#d8c6a0;font-size:13px;max-width:900px}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.col h2{margin:0 0 8px;font-size:14px}
.stage{position:relative;width:400px;height:260px;border-radius:14px;background:repeating-conic-gradient(#2a2210 0 25%,#221b0c 0 50%) 0 0/24px 24px;border:1px solid #ffd27a44;overflow:hidden}
.stage.light{background:#f4f1ea}
.stage>img.ref{width:100%;height:100%;object-fit:contain}
.overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:.45;pointer-events:none}
button{margin-top:10px;padding:8px 14px;border-radius:10px;border:0;background:linear-gradient(135deg,#fff0a0,#ffc24a);color:#2a1a04;font:800 13px Manrope,sans-serif;cursor:pointer}
label{display:block;margin-top:8px;font-size:12px;color:#d8c6a0}
/* кукла: координаты образца 1585×992 */
.puppet{position:absolute;left:0;top:0;width:1585px;height:992px;transform-origin:0 0}
.shake,.body,.grp{position:absolute;inset:0}
.part{position:absolute;display:block;pointer-events:none}
/* Стойка: крылья мерно взмахивают, страж дышит — шлем чуть приподнимается, щит и копьё покачиваются; доспех мягко сияет */
.floating .body{animation:g-glow 3.6s ease-in-out infinite}
.floating .i-wing-l{animation:g-flap-l 2.8s ease-in-out infinite}
.floating .i-wing-r{animation:g-flap-r 2.8s ease-in-out infinite}
.floating .i-head{animation:g-head 3.6s ease-in-out infinite}
.floating .i-shield{animation:g-shield 3.6s ease-in-out -.4s infinite}
.floating .i-spear{animation:g-spear 3.6s ease-in-out -.8s infinite}
@keyframes g-glow{0%,100%{filter:drop-shadow(0 0 8px rgba(255,220,130,.35))}50%{filter:drop-shadow(0 0 22px rgba(255,225,140,.7))}}
@keyframes g-flap-l{0%,100%{transform:none}50%{transform:rotate(-3deg)}}
@keyframes g-flap-r{0%,100%{transform:none}50%{transform:rotate(3deg)}}
@keyframes g-head{0%,100%{transform:none}50%{transform:translateY(-4px)}}
@keyframes g-shield{0%,100%{transform:none}50%{transform:rotate(1.2deg) translateY(-3px)}}
@keyframes g-spear{0%,100%{transform:none}50%{transform:rotate(-1deg) translateY(-3px)}}
/* Удар: страж вздрагивает, шлем откидывается, щит вскидывается, копьё кренится, крылья распахиваются */
.hit .shake{animation:g-shake .5s linear}
.hit .g-head{animation:g-hit-head .55s cubic-bezier(.2,.9,.3,1)}
.hit .g-shield{animation:g-hit-shield .55s cubic-bezier(.2,.9,.3,1)}
.hit .g-spear{animation:g-hit-spear .6s cubic-bezier(.2,.9,.3,1)}
.hit .g-wing-l{animation:g-hit-wing-l .6s cubic-bezier(.2,.9,.3,1)}
.hit .g-wing-r{animation:g-hit-wing-r .6s cubic-bezier(.2,.9,.3,1)}
.hit .body img{animation:g-hit-flash .5s ease-out}
@keyframes g-shake{0%,100%{transform:none}10%{transform:translateX(-12px)}22%{transform:translateX(10px)}34%{transform:translateX(-7px)}48%{transform:translateX(4px)}64%{transform:translateX(-2px)}}
@keyframes g-hit-head{0%{transform:none}14%{transform:translateY(-8px) rotate(-3deg)}60%{transform:translateY(1px)}100%{transform:none}}
@keyframes g-hit-shield{0%{transform:none}14%{transform:translate(-10px,-14px) rotate(-4deg)}60%{transform:translate(1px,1px)}100%{transform:none}}
@keyframes g-hit-spear{0%{transform:none}16%{transform:rotate(5deg)}60%{transform:rotate(-1deg)}100%{transform:none}}
@keyframes g-hit-wing-l{0%{transform:none}16%{transform:rotate(5deg)}60%{transform:rotate(-1deg)}100%{transform:none}}
@keyframes g-hit-wing-r{0%{transform:none}16%{transform:rotate(-5deg)}60%{transform:rotate(1deg)}100%{transform:none}}
@keyframes g-hit-flash{0%{filter:none}10%{filter:brightness(.82) saturate(1.25)}35%{filter:brightness(1.15)}100%{filter:none}}
</style>
</head>
<body>
<h1>Сияющий страж — сборка из частей</h1>
<p class="lead">Образец и страж, нарезанный из него на подвижные части (два крыла, шлем, щит, копьё с кулаком) поверх подложки: на тёмном фоне, на светлой подложке, в стойке и с ударами.</p>
<div class="row">
 <div class="col"><h2>Образец</h2><div class="stage"><img class="ref" src="reference.png" alt=""></div></div>
 <div class="col"><h2>Собран из частей</h2><div class="stage" id="still"></div><label><input type="checkbox" id="ov"> наложить образец</label></div>
 <div class="col"><h2>Светлая подложка</h2><div class="stage light" id="light"></div></div>
 <div class="col"><h2>Стоит</h2><div class="stage" id="idle"></div></div>
 <div class="col"><h2>Стоит + удары</h2><div class="stage" id="hits"></div><button id="hit">⚔ Ударить</button><label><input type="checkbox" id="loop" checked> бить каждые 1,2 с</label></div>
</div>
<script>
const P='../../assets/bosses/radiant-guardian/',CW=1585,CH=992;
// Часть: файл, центр (в координатах образца), группа. Части вырезаны прямо из образца: крылья — у плеч (лежат за телом),
// шлем — по шее, щит — по контуру, копьё с кулаком — от предплечья (перья за древком отделены по цвету).
// Под ними — подложка (under): размытый образец полосой ~32 px вокруг тела; закрывает щёлки швов.
const PARTS=[
 ['under',782.5,572,'under'],['wing-l',315,344.5,'wing-l'],['wing-r',1276.5,325.5,'wing-r'],['body',786.5,582.5,'body'],
 ['head',795,162,'head'],['spear',995,484,'spear'],['shield',608,514.5,'shield']
];
// Точки поворота — на швах: корни крыльев, шея, рука со щитом, кулак с копьём.
const PIVOT={'under':[790,600],'body':[790,600],'wing-l':[700,280],'wing-r':[880,280],'head':[800,245],'shield':[690,430],'spear':[960,410]};
const SIZE={};
async function sizes(){await Promise.all(PARTS.map(([f])=>new Promise(r=>{const i=new Image();i.onload=()=>{SIZE[f]=[i.naturalWidth,i.naturalHeight];r();};i.src=P+f+'.png';})));}
function build(stage){
 const sw=stage.clientWidth,k=Math.min(sw/CW,stage.clientHeight/CH),puppet=document.createElement('div');puppet.className='puppet';puppet.style.transform=`translateX(${(sw-CW*k)/2}px) scale(${k})`;
 const shake=document.createElement('div');shake.className='shake';const body=document.createElement('div');body.className='body';shake.append(body);puppet.append(shake);const groups={};
 for(const [file,cx,cy,g] of PARTS){
  if(!groups[g]){const el=document.createElement('div');el.className='grp g-'+g;const idle=document.createElement('div');idle.className='grp i-'+g;el.style.transformOrigin=idle.style.transformOrigin=PIVOT[g].map(v=>v+'px').join(' ');el.append(idle);body.append(el);groups[g]=idle;}
  const [w,h]=SIZE[file],img=new Image();img.className='part p-'+file;img.src=P+file+'.png';
  Object.assign(img.style,{width:w+'px',height:h+'px',left:cx-w/2+'px',top:cy-h/2+'px'});
  groups[g].append(img);
 }
 stage.append(puppet);return puppet;
}
if(location.hash==='#big'){document.querySelectorAll('.col').forEach((c,i)=>{if(i!==1)c.style.display='none'});const s=document.getElementById('still');s.style.width='1585px';s.style.height='992px';document.querySelector('.lead').hidden=true;}
sizes().then(()=>{
 build(document.getElementById('still'));
 const ov=document.createElement('img');ov.className='overlay';ov.src='reference.png';ov.hidden=true;document.getElementById('still').append(ov);
 document.getElementById('ov').onchange=e=>ov.hidden=!e.target.checked;
 build(document.getElementById('light'));
 build(document.getElementById('idle')).classList.add('floating');
 const hits=build(document.getElementById('hits'));hits.classList.add('floating');
 const hit=()=>{hits.classList.remove('hit');void hits.offsetWidth;hits.classList.add('hit');};
 document.getElementById('hit').onclick=hit;setInterval(()=>{if(document.getElementById('loop').checked)hit();},1200);
});
</script>
</body>
</html>
