<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пепельный феникс — сборка и анимация</title>
<style>
:root{color-scheme:dark}
body{margin:0;padding:24px;background:radial-gradient(ellipse at 50% 0,#3a1a12,#120806 70%);color:#ffece0;font-family:Manrope,'Segoe UI',sans-serif}
h1{margin:0 0 6px;font-size:20px}.lead{margin:0 0 18px;color:#d8b4a0;font-size:13px;max-width:900px}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.col h2{margin:0 0 8px;font-size:14px}
.stage{position:relative;width:300px;height:330px;border-radius:14px;background:repeating-conic-gradient(#2a1510 0 25%,#22110c 0 50%) 0 0/24px 24px;border:1px solid #ff8a5044;overflow:hidden}
.stage.light{background:#f4f1ea}
.stage>img.ref{width:100%;height:100%;object-fit:contain}
.overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:.45;pointer-events:none}
button{margin-top:10px;padding:8px 14px;border-radius:10px;border:0;background:linear-gradient(135deg,#ffd27a,#ff8a50);color:#2a0d04;font:800 13px Manrope,sans-serif;cursor:pointer}
label{display:block;margin-top:8px;font-size:12px;color:#d8b4a0}
/* кукла: координаты образца 1199×1312 */
.puppet{position:absolute;left:0;top:0;width:1199px;height:1312px;transform-origin:0 0}
.shake,.body,.grp{position:absolute;inset:0}
.part{position:absolute;display:block;pointer-events:none}
/* Полёт: феникс парит и машет крыльями — на взмахе вниз тело чуть поднимается; хвост струится, голова поворачивается, огонь мерцает */
.floating .body{animation:p-float 3.6s ease-in-out infinite}
.floating .i-wing-l{animation:p-flap-l 1.8s ease-in-out infinite}
.floating .i-wing-r{animation:p-flap-r 1.8s ease-in-out infinite}
.floating .i-tail{animation:p-tail 3.2s ease-in-out infinite}
.floating .i-head{animation:p-head 4s ease-in-out -.6s infinite}
@keyframes p-float{0%,100%{transform:translateY(0);filter:none}25%{filter:brightness(1.06)}50%{transform:translateY(-14px);filter:brightness(.97)}75%{filter:brightness(1.05)}}
@keyframes p-flap-l{0%,100%{transform:none}50%{transform:rotate(-4deg)}}
@keyframes p-flap-r{0%,100%{transform:none}50%{transform:rotate(4deg)}}
@keyframes p-tail{0%,100%{transform:rotate(-1.6deg) skewX(1.5deg)}50%{transform:rotate(1.8deg) skewX(-2deg)}}
@keyframes p-head{0%,100%{transform:none}50%{transform:rotate(-2deg)}}
/* Удар: феникс вздрагивает, голова откидывается, крылья вскидываются, хвост хлещет */
.hit .shake{animation:p-shake .5s linear}
.hit .g-head{animation:p-hit-head .55s cubic-bezier(.2,.9,.3,1)}
.hit .g-wing-l{animation:p-hit-wing-l .6s cubic-bezier(.2,.9,.3,1)}
.hit .g-wing-r{animation:p-hit-wing-r .6s cubic-bezier(.2,.9,.3,1)}
.hit .g-tail{animation:p-hit-tail .6s cubic-bezier(.2,.9,.3,1)}
.hit .body img{animation:p-hit-flash .5s ease-out}
@keyframes p-shake{0%,100%{transform:none}10%{transform:translateX(-12px)}22%{transform:translateX(10px)}34%{transform:translateX(-7px)}48%{transform:translateX(4px)}64%{transform:translateX(-2px)}}
@keyframes p-hit-head{0%{transform:none}14%{transform:rotate(-5deg) translateY(-6px)}60%{transform:rotate(1deg)}100%{transform:none}}
@keyframes p-hit-wing-l{0%{transform:none}16%{transform:rotate(6deg)}60%{transform:rotate(-1.5deg)}100%{transform:none}}
@keyframes p-hit-wing-r{0%{transform:none}16%{transform:rotate(-6deg)}60%{transform:rotate(1.5deg)}100%{transform:none}}
@keyframes p-hit-tail{0%{transform:none}18%{transform:rotate(3deg) skewX(-3deg)}62%{transform:rotate(-1deg)}100%{transform:none}}
@keyframes p-hit-flash{0%{filter:none}10%{filter:brightness(.82) saturate(1.25)}35%{filter:brightness(1.15)}100%{filter:none}}
</style>
</head>
<body>
<h1>Пепельный феникс — сборка из частей</h1>
<p class="lead">Образец и феникс, нарезанный из него на подвижные части (два крыла, голова с хохолком, хвост) поверх подложки: на тёмном фоне, на светлой подложке, в полёте и с ударами.</p>
<div class="row">
 <div class="col"><h2>Образец</h2><div class="stage"><img class="ref" src="reference.png" alt=""></div></div>
 <div class="col"><h2>Собран из частей</h2><div class="stage" id="still"></div><label><input type="checkbox" id="ov"> наложить образец</label></div>
 <div class="col"><h2>Светлая подложка</h2><div class="stage light" id="light"></div></div>
 <div class="col"><h2>Летит</h2><div class="stage" id="idle"></div></div>
 <div class="col"><h2>Летит + удары</h2><div class="stage" id="hits"></div><button id="hit">⚔ Ударить</button><label><input type="checkbox" id="loop" checked> бить каждые 1,2 с</label></div>
</div>
<script>
const P='../../assets/bosses/ash-phoenix/',CW=1199,CH=1312;
// Часть: файл, центр (в координатах образца), группа. Части вырезаны прямо из образца по швам: крылья — у плеч,
// голова с хохолком — по шее, хвост — за лапами; грудь с лапами — неподвижное тело. Дальнее (левое) крыло — за телом.
// Под ними — подложка (under): размытый образец полосой ~32 px вокруг тела; закрывает щёлки швов.
const PARTS=[
 ['under',619,560,'under'],['tail',463,973.5,'tail'],['wing-l',365,325,'wing-l'],['body',630.5,570,'body'],
 ['wing-r',915,711,'wing-r'],['head',649.5,281.5,'head']
];
// Точки поворота — на швах: плечи крыльев, шея, основание хвоста.
const PIVOT={'under':[640,600],'body':[640,600],'wing-l':[640,560],'wing-r':[740,600],'head':[720,440],'tail':[600,700]};
const SIZE={};
async function sizes(){await Promise.all(PARTS.map(([f])=>new Promise(r=>{const i=new Image();i.onload=()=>{SIZE[f]=[i.naturalWidth,i.naturalHeight];r();};i.src=P+f+'.png';})));}
function build(stage){
 const sw=stage.clientWidth,k=Math.min(sw/CW,stage.clientHeight/CH),puppet=document.createElement('div');puppet.className='puppet';puppet.style.transform=`translateX(${(sw-CW*k)/2}px) scale(${k})`;
 // дрожь удара — на отдельном слое, чтобы не перебивать полёт тела
 const shake=document.createElement('div');shake.className='shake';const body=document.createElement('div');body.className='body';shake.append(body);puppet.append(shake);const groups={};
 for(const [file,cx,cy,g] of PARTS){
  if(!groups[g]){const el=document.createElement('div');el.className='grp g-'+g;const idle=document.createElement('div');idle.className='grp i-'+g;el.style.transformOrigin=idle.style.transformOrigin=PIVOT[g].map(v=>v+'px').join(' ');el.append(idle);body.append(el);groups[g]=idle;}
  const [w,h]=SIZE[file],img=new Image();img.className='part p-'+file;img.src=P+file+'.png';
  Object.assign(img.style,{width:w+'px',height:h+'px',left:cx-w/2+'px',top:cy-h/2+'px'});
  groups[g].append(img);
 }
 stage.append(puppet);return puppet;
}
// #big — крупная сборка для проверки швов.
if(location.hash==='#big'){document.querySelectorAll('.col').forEach((c,i)=>{if(i!==1)c.style.display='none'});const s=document.getElementById('still');s.style.width='1199px';s.style.height='1312px';document.querySelector('.lead').hidden=true;}
sizes().then(()=>{
 build(document.getElementById('still'));
 const ov=document.createElement('img');ov.className='overlay';ov.src='reference.png';ov.hidden=true;document.getElementById('still').append(ov);
 document.getElementById('ov').onchange=e=>ov.hidden=!e.target.checked;
 build(document.getElementById('light'));
 build(document.getElementById('idle')).classList.add('floating');
 const hits=build(document.getElementById('hits'));hits.classList.add('floating');
 const hit=()=>{hits.classList.remove('hit');void hits.offsetWidth;hits.classList.add('hit');};
 document.getElementById('hit').onclick=hit;setInterval(()=>{if(document.getElementById('loop').checked)hit();},1200);
});
</script>
</body>
</html>
