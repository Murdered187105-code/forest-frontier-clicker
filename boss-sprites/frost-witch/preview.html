<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Морозная ведьма — сборка и анимация</title>
<style>
:root{color-scheme:dark}
body{margin:0;padding:24px;background:radial-gradient(ellipse at 50% 0,#14283a,#060c14 70%);color:#e6f4ff;font-family:Manrope,'Segoe UI',sans-serif}
h1{margin:0 0 6px;font-size:20px}.lead{margin:0 0 18px;color:#a0bcd8;font-size:13px;max-width:900px}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.col h2{margin:0 0 8px;font-size:14px}
.stage{position:relative;width:260px;height:330px;border-radius:14px;background:repeating-conic-gradient(#102030 0 25%,#0c1826 0 50%) 0 0/24px 24px;border:1px solid #7ad4ff44;overflow:hidden}
.stage.light{background:#f4f1ea}
.stage>img.ref{width:100%;height:100%;object-fit:contain}
.overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:.45;pointer-events:none}
button{margin-top:10px;padding:8px 14px;border-radius:10px;border:0;background:linear-gradient(135deg,#bff0ff,#5fc6ff);color:#04182a;font:800 13px Manrope,sans-serif;cursor:pointer}
label{display:block;margin-top:8px;font-size:12px;color:#a0bcd8}
/* кукла: координаты образца 1108×1420 */
.puppet{position:absolute;left:0;top:0;width:1108px;height:1420px;transform-origin:0 0}
.shake,.body,.grp{position:absolute;inset:0}
.part{position:absolute;display:block;pointer-events:none}
/* Стойка: снежинка парит над ладонью, медленно вращается и мерцает; посох с рукой чуть покачивается; голова величаво поводится */
.floating .body{animation:w-glow 3.8s ease-in-out infinite}
.floating .i-snow{animation:w-snow-float 2.8s ease-in-out infinite}
.floating .p-snow{animation:w-snow-spin 9s linear infinite,w-snow-glow 2.2s ease-in-out infinite}
.floating .i-staff{animation:w-staff 3.8s ease-in-out -.5s infinite}
.floating .i-head{animation:w-head 4.6s ease-in-out infinite}
@keyframes w-glow{0%,100%{filter:drop-shadow(0 0 6px rgba(120,220,255,.25))}50%{filter:drop-shadow(0 0 18px rgba(140,225,255,.55))}}
@keyframes w-snow-float{0%,100%{transform:translateY(-12px)}50%{transform:translateY(10px)}}
@keyframes w-snow-spin{to{transform:rotate(360deg)}}
@keyframes w-snow-glow{0%,100%{filter:brightness(1) drop-shadow(0 0 6px #8fe6ff)}50%{filter:brightness(1.35) drop-shadow(0 0 18px #bff3ff)}}
@keyframes w-staff{0%,100%{transform:none}50%{transform:rotate(-1.2deg)}}
@keyframes w-head{0%,100%{transform:none}50%{transform:rotate(-1.4deg)}}
/* Удар: ведьма вздрагивает, голова откидывается, посох кренится, снежинку отбрасывает в сторону */
.hit .shake{animation:w-shake .5s linear}
.hit .g-head{animation:w-hit-head .55s cubic-bezier(.2,.9,.3,1)}
.hit .g-staff{animation:w-hit-staff .6s cubic-bezier(.2,.9,.3,1)}
.hit .g-snow{animation:w-hit-snow .6s cubic-bezier(.2,.9,.3,1)}
.hit .body img:not(.p-snow){animation:w-hit-flash .5s ease-out}
@keyframes w-shake{0%,100%{transform:none}10%{transform:translateX(-12px)}22%{transform:translateX(10px)}34%{transform:translateX(-7px)}48%{transform:translateX(4px)}64%{transform:translateX(-2px)}}
@keyframes w-hit-head{0%{transform:none}14%{transform:rotate(-4deg) translateY(-6px)}60%{transform:rotate(1deg)}100%{transform:none}}
@keyframes w-hit-staff{0%{transform:none}16%{transform:rotate(3deg)}60%{transform:rotate(-.8deg)}100%{transform:none}}
@keyframes w-hit-snow{0%{transform:none}16%{transform:translate(-40px,-30px) scale(1.15)}60%{transform:translate(3px,2px)}100%{transform:none}}
@keyframes w-hit-flash{0%{filter:none}10%{filter:brightness(.82) saturate(1.25)}35%{filter:brightness(1.15)}100%{filter:none}}
</style>
</head>
<body>
<h1>Морозная ведьма — сборка из частей</h1>
<p class="lead">Образец и ведьма, нарезанная из него на подвижные части (снежинка с осколками, посох с рукой, голова с короной) поверх подложки: на тёмном фоне, на светлой подложке, в стойке и с ударами.</p>
<div class="row">
 <div class="col"><h2>Образец</h2><div class="stage"><img class="ref" src="reference.png" alt=""></div></div>
 <div class="col"><h2>Собран из частей</h2><div class="stage" id="still"></div><label><input type="checkbox" id="ov"> наложить образец</label></div>
 <div class="col"><h2>Светлая подложка</h2><div class="stage light" id="light"></div></div>
 <div class="col"><h2>Стоит</h2><div class="stage" id="idle"></div></div>
 <div class="col"><h2>Стоит + удары</h2><div class="stage" id="hits"></div><button id="hit">⚔ Ударить</button><label><input type="checkbox" id="loop" checked> бить каждые 1,2 с</label></div>
</div>
<script>
const P='../../assets/bosses/frost-witch/',CW=1108,CH=1420;
// Часть: файл, центр (в координатах образца), группа. Снежинка с осколками — отдельные кусочки над ладонью;
// посох вырезан вместе с кистью; голова с короной — по шее. Под ними — подложка (under) вдоль тела.
const PARTS=[
 ['under',545.5,715,'under'],['body',545.5,714,'body'],['head',555,163.5,'head'],['staff',930.5,715,'staff'],['snow',184.5,360,'snow']
];
// Точки поворота: шея, низ посоха (он стоит на земле), центр снежинки.
const PIVOT={'under':[560,900],'body':[560,900],'head':[555,300],'staff':[928,1400],'snow':[190,362]};
const SIZE={};
async function sizes(){await Promise.all(PARTS.map(([f])=>new Promise(r=>{const i=new Image();i.onload=()=>{SIZE[f]=[i.naturalWidth,i.naturalHeight];r();};i.src=P+f+'.png';})));}
function build(stage){
 const sw=stage.clientWidth,k=Math.min(sw/CW,stage.clientHeight/CH),puppet=document.createElement('div');puppet.className='puppet';puppet.style.transform=`translateX(${(sw-CW*k)/2}px) scale(${k})`;
 const shake=document.createElement('div');shake.className='shake';const body=document.createElement('div');body.className='body';shake.append(body);puppet.append(shake);const groups={};
 for(const [file,cx,cy,g] of PARTS){
  if(!groups[g]){const el=document.createElement('div');el.className='grp g-'+g;const idle=document.createElement('div');idle.className='grp i-'+g;el.style.transformOrigin=idle.style.transformOrigin=PIVOT[g].map(v=>v+'px').join(' ');el.append(idle);body.append(el);groups[g]=idle;}
  const [w,h]=SIZE[file],img=new Image();img.className='part p-'+file;img.src=P+file+'.png';
  Object.assign(img.style,{width:w+'px',height:h+'px',left:cx-w/2+'px',top:cy-h/2+'px'});
  groups[g].append(img);
 }
 stage.append(puppet);return puppet;
}
if(location.hash==='#big'){document.querySelectorAll('.col').forEach((c,i)=>{if(i!==1)c.style.display='none'});const s=document.getElementById('still');s.style.width='1108px';s.style.height='1420px';document.querySelector('.lead').hidden=true;}
sizes().then(()=>{
 build(document.getElementById('still'));
 const ov=document.createElement('img');ov.className='overlay';ov.src='reference.png';ov.hidden=true;document.getElementById('still').append(ov);
 document.getElementById('ov').onchange=e=>ov.hidden=!e.target.checked;
 build(document.getElementById('light'));
 build(document.getElementById('idle')).classList.add('floating');
 const hits=build(document.getElementById('hits'));hits.classList.add('floating');
 const hit=()=>{hits.classList.remove('hit');void hits.offsetWidth;hits.classList.add('hit');};
 document.getElementById('hit').onclick=hit;setInterval(()=>{if(document.getElementById('loop').checked)hit();},1200);
});
</script>
</body>
</html>
