<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Огненный дракон — сборка и анимация</title>
<style>
:root{color-scheme:dark}
body{margin:0;padding:24px;background:radial-gradient(ellipse at 50% 0,#3a1a12,#120806 70%);color:#ffece0;font-family:Manrope,'Segoe UI',sans-serif}
h1{margin:0 0 6px;font-size:20px}.lead{margin:0 0 18px;color:#d8b4a0;font-size:13px;max-width:900px}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.col h2{margin:0 0 8px;font-size:14px}
.stage{position:relative;width:520px;height:260px;border-radius:14px;background:repeating-conic-gradient(#2a1510 0 25%,#22110c 0 50%) 0 0/24px 24px;border:1px solid #ff8a5044;overflow:hidden}
.stage.light{background:#f4f1ea}
.stage>img.ref{width:100%;height:100%;object-fit:contain}
.overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:.45;pointer-events:none}
button{margin-top:10px;padding:8px 14px;border-radius:10px;border:0;background:linear-gradient(135deg,#ffd27a,#ff8a50);color:#2a0d04;font:800 13px Manrope,sans-serif;cursor:pointer}
label{display:block;margin-top:8px;font-size:12px;color:#d8b4a0}
/* кукла: координаты образца 1774×887 */
.puppet{position:absolute;left:0;top:0;width:1774px;height:887px;transform-origin:0 0}
.body,.grp{position:absolute;inset:0}
.part{position:absolute;display:block;pointer-events:none}
</style>
<style id="anim">
/* Дыхание: крылья мерно приподнимаются, голова чуть покачивается, хвост лениво водит звеньями.
   Амплитуды малые: части вырезаны из цельного образца, и шов должен лишь едва смещаться над подложкой. */
.floating .i-wings{animation:d-wing 3.6s ease-in-out infinite}
.floating .i-head{animation:d-head 3.6s ease-in-out -.4s infinite}
.floating .i-tail-1{animation:d-tail-1 4.4s ease-in-out infinite}
.floating .i-tail-2{animation:d-tail-2 4.4s ease-in-out -.6s infinite}
@keyframes d-wing{0%,100%{transform:none}50%{transform:rotate(-1.6deg)}}
@keyframes d-head{0%,100%{transform:none}50%{transform:rotate(1.6deg)}}
@keyframes d-tail-1{0%,100%{transform:rotate(.6deg)}50%{transform:rotate(-.8deg)}}
@keyframes d-tail-2{0%,100%{transform:rotate(1.5deg)}50%{transform:rotate(-2deg)}}
/* Удар: дракон вздрагивает, голова вскидывается, крылья взмётываются, хвост хлещет */
.hit .body{animation:d-shake .5s linear}
.hit .g-head{animation:d-hit-head .55s cubic-bezier(.2,.9,.3,1)}
.hit .g-wings{animation:d-hit-wing .6s cubic-bezier(.2,.9,.3,1)}
.hit .g-tail-1{animation:d-hit-tail-1 .6s cubic-bezier(.2,.9,.3,1)}
.hit .g-tail-2{animation:d-hit-tail-2 .6s cubic-bezier(.2,.9,.3,1)}
.hit .body img{animation:d-hit-flash .5s ease-out}
@keyframes d-shake{0%,100%{transform:none}10%{transform:translateX(12px)}22%{transform:translateX(-9px)}34%{transform:translateX(7px)}48%{transform:translateX(-4px)}64%{transform:translateX(2px)}}
@keyframes d-hit-head{0%{transform:none}14%{transform:rotate(4.5deg)}60%{transform:rotate(-1deg)}100%{transform:none}}
@keyframes d-hit-wing{0%{transform:none}16%{transform:rotate(-4deg)}60%{transform:rotate(1deg)}100%{transform:none}}
@keyframes d-hit-tail-1{0%{transform:none}16%{transform:rotate(-1.5deg)}60%{transform:rotate(.6deg)}100%{transform:none}}
@keyframes d-hit-tail-2{0%{transform:none}18%{transform:rotate(-4deg)}62%{transform:rotate(1.5deg)}100%{transform:none}}
@keyframes d-hit-flash{0%{filter:none}10%{filter:brightness(.82) saturate(1.25)}35%{filter:brightness(1.15)}100%{filter:none}}
</style>
</head>
<body>
<h1>Огненный дракон — сборка из частей</h1>
<p class="lead">Образец позы и дракон, нарезанный из него на подвижные части (крылья, голова, два звена хвоста) поверх подложки из деталей листа: на тёмном фоне, на светлой подложке, в покое и с ударами.</p>
<div class="row">
 <div class="col"><h2>Образец</h2><div class="stage"><img class="ref" src="reference.png" alt=""></div></div>
 <div class="col"><h2>Собран из частей</h2><div class="stage" id="still"></div><label><input type="checkbox" id="ov"> наложить образец</label></div>
 <div class="col"><h2>Светлая подложка</h2><div class="stage light" id="light"></div></div>
 <div class="col"><h2>Дышит</h2><div class="stage" id="idle"></div></div>
 <div class="col"><h2>Дышит + удары</h2><div class="stage" id="hits"></div><button id="hit">⚔ Ударить</button><label><input type="checkbox" id="loop" checked> бить каждые 1,2 с</label></div>
</div>
<script>
const P='../../assets/bosses/fire-dragon/',CW=1774,CH=887;
// Часть: файл, центр (в координатах образца), масштаб, поворот (°), группа, отражение по горизонтали.
// Части вырезаны прямо из образца 02-crouch.png по швам: крылья — по нижнему краю перепонки, голова — по шее за гривой,
// хвост — двумя звеньями от крупа; всё остальное — неподвижное тело с лапами. В покое они складываются ровно в образец.
// Под ними — подложка (ref-under): дракон из деталей листа, обрезанный по силуэту образца и только полосой ~28 px
// вокруг неподвижного тела; она видна лишь в щёлке шва, когда часть сдвигается, и закрывает её тем же цветом.
const PARTS=[
 ['ref-under',692.5,541.5,1,0,'under'],
 ['ref-tail-1',1400.5,375.5,1,0,'tail-1'],['ref-tail-2',1469,606,1,0,'tail-2'],
 ['ref-body',683,555.5,1,0,'body'],
 ['ref-wings',922.5,271.5,1,0,'wings'],
 ['ref-head',272.5,521,1,0,'head']
];
// Точки поворота — на швах: корень крыльев у плеча, основание шеи, круп и середина хвоста.
const PIVOT={'under':[900,500],'body':[900,500],'wings':[700,510],'head':[398,475],'tail-1':[1250,380],'tail-2':[1560,425]};
// Цепочки: дочерняя группа движется вместе с родительской; true — рисуется под деталями родителя.
const PARENT={'tail-2':['tail-1',true]};
const SIZE={};
async function sizes(){await Promise.all(PARTS.map(([f])=>new Promise(r=>{const i=new Image();i.onload=()=>{SIZE[f]=[i.naturalWidth,i.naturalHeight];r();};i.src=P+f+'.png';})));}
function build(stage){
 const sw=stage.clientWidth,k=Math.min(sw/CW,stage.clientHeight/CH),puppet=document.createElement('div');puppet.className='puppet';puppet.style.transform=`translateX(${(sw-CW*k)/2}px) scale(${k})`;
 const body=document.createElement('div');body.className='body';puppet.append(body);const groups={};
 for(const [file,cx,cy,s,rot,g,flip] of PARTS){
  if(!groups[g]){const el=document.createElement('div');el.className='grp g-'+g;const idle=document.createElement('div');idle.className='grp i-'+g;el.style.transformOrigin=idle.style.transformOrigin=PIVOT[g].map(v=>v+'px').join(' ');el.append(idle);const [par,under]=PARENT[g]||[];if(par)groups[par][under?'prepend':'append'](el);else body.append(el);groups[g]=idle;}
  const [w,h]=SIZE[file],img=new Image();img.className='part p-'+file;img.src=P+file+'.png';
  Object.assign(img.style,{width:w*s+'px',height:h*s+'px',left:cx-w*s/2+'px',top:cy-h*s/2+'px',transform:`rotate(${rot}deg)${flip?' scaleX(-1)':''}`});
  groups[g].append(img);
 }
 stage.append(puppet);return puppet;
}
// #big — крупная сборка с образцом под ней для подгонки деталей.
if(location.hash==='#big'){document.querySelectorAll('.col').forEach((c,i)=>{if(i!==1)c.style.display='none'});const s=document.getElementById('still');s.style.width='1774px';s.style.height='887px';document.querySelector('.lead').hidden=true;}
sizes().then(()=>{
 build(document.getElementById('still'));
 const ov=document.createElement('img');ov.className='overlay';ov.src='reference.png';ov.hidden=true;document.getElementById('still').append(ov);
 document.getElementById('ov').onchange=e=>ov.hidden=!e.target.checked;
 build(document.getElementById('light'));
 build(document.getElementById('idle')).classList.add('floating');
 const hits=build(document.getElementById('hits'));hits.classList.add('floating');
 const hit=()=>{hits.classList.remove('hit');void hits.offsetWidth;hits.classList.add('hit');};
 document.getElementById('hit').onclick=hit;setInterval(()=>{if(document.getElementById('loop').checked)hit();},1200);
});
</script>
</body>
</html>
